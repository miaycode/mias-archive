{% extends "base.html" %}

{% block content %}
<section class="page">
    <div class="page-heading">
        <h1>Blog</h1>
        <a class="read-more" href="{{ url_for('add_item', item_type='blog') }}">Add blog post</a>
    </div>
    <div class="grid">
        {% for post in posts %}
        <article class="card">
            <p class="meta">{{ post.date }} / {{ post.category }}</p>
            <h2>{{ post.title }}</h2>
            <p>{{ post.summary }}</p>
            <div class="card-actions">
                <a class="read-more" href="{{ url_for('blog_post', slug=post.slug) }}">Read full post</a>
                <a class="read-more" href="{{ url_for('edit_item', item_type='blog', slug=post.slug) }}">Edit</a>
            </div>
        </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
